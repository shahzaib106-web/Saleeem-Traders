services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saleeem
    ports: ["5432:5432"]
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saleeem
  storefront:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports: ["3000:3000"]
  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/admin.Dockerfile
    ports: ["3001:3001"]
